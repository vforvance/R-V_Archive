<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveOS 98</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="desktop-bg">

    <div id="desktop">
        <div class="icon" ondblclick="openWindow('music-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png">
            <span>Our Playlist</span>
        </div>
        <div class="icon" ondblclick="openWindow('photos-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/camera3-2.png">
            <span>Us.jpg</span>
        </div>
        <div class="icon" ondblclick="createStickyNote()">
            <img src="https://win98icons.alexmeub.com/icons/png/note-0.png">
            <span>New Note</span>
        </div>
        <div class="icon" ondblclick="openWindow('rain-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/world-2.png">
            <span>Rainy Mood</span>
        </div>
        <div class="icon" ondblclick="openWindow('poetry-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-2.png">
            <span>Love_Letter.txt</span>
        </div>
    </div>

    <div id="start-menu" class="start-menu" style="display: none;">
        <div class="sidebar"><span class="vertical-text">LoveOS 98</span></div>
        <div class="menu-items">
            <div class="menu-item" onclick="openWindow('settings-window'); toggleStartMenu()">
                <img src="https://win98icons.alexmeub.com/icons/png/settings_gear-0.png"> Settings
            </div>
            <div class="divider"></div>
            <div class="menu-item" onclick="alert('I love you!')">
                <img src="https://win98icons.alexmeub.com/icons/png/key_padlock-0.png"> Log Off
            </div>
        </div>
    </div>

    <div id="music-window" class="window draggable" style="display: none; top: 100px; left: 100px;">
        <div class="title-bar">
            <div class="title-bar-text">Spotify</div>
            <div class="title-bar-controls"><button aria-label="Close" onclick="closeWindow('music-window')"></button></div>
        </div>
        <div class="window-body">
            <iframe src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M" width="100%" height="152" frameBorder="0" allow="encrypted-media"></iframe>
        </div>
    </div>

    <div id="photos-window" class="window draggable" style="display: none; top: 50px; left: 50px;">
        <div class="title-bar">
            <div class="title-bar-text">Photo Viewer</div>
            <div class="title-bar-controls"><button aria-label="Close" onclick="closeWindow('photos-window')"></button></div>
        </div>
        <div class="window-body">
            <img id="current-photo" src="Gemini_Generated_Image_5jaj355jaj355jaj.png" style="width:100%; height: auto; border: 2px inset #fff;">
            <div class="field-row" style="justify-content: center; margin-top: 10px;">
                <button onclick="changePhoto(-1)">Back</button>
                <button onclick="changePhoto(1)">Next</button>
            </div>
        </div>
    </div>

    <div id="rain-window" class="window draggable" style="display: none; top: 20px; left: 400px;">
        <div class="title-bar">
            <div class="title-bar-text">Rainy Mood</div>
            <div class="title-bar-controls"><button aria-label="Close" onclick="closeWindow('rain-window')"></button></div>
        </div>
        <div class="window-body">
            <iframe src="https://rainymood.com/" width="300" height="400"></iframe>
        </div>
    </div>

    <div id="poetry-window" class="window draggable" style="display: none; top: 150px; left: 300px;">
        <div class="title-bar">
            <div class="title-bar-text">Notepad</div>
            <div class="title-bar-controls"><button aria-label="Close" onclick="closeWindow('poetry-window')"></button></div>
        </div>
        <div class="window-body">
            <textarea style="width:100%; height:150px; background:white;"></textarea>
        </div>
    </div>

    <div id="settings-window" class="window draggable" style="display: none; top: 200px; left: 200px;">
        <div class="title-bar">
            <div class="title-bar-text">Settings</div>
            <div class="title-bar-controls"><button aria-label="Close" onclick="closeWindow('settings-window')"></button></div>
        </div>
        <div class="window-body">
            <p>Wallpaper:</p>
            <input type="file" onchange="uploadBackground(event)">
            <button onclick="resetBackground()" style="margin-top:10px">Reset</button>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-button" onclick="toggleStartMenu()">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png">
            <b>Start ❤️</b>
        </button>
        <div class="time-box" id="clock">12:00 PM</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
