<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="desktop">
        <div class="icon" ondblclick="openWindow('music-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png" alt="Music">
            <span>Our Playlist</span>
        </div>
        <div class="icon" ondblclick="openWindow('video-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/film_strip-0.png" alt="Videos">
            <span>Our Videos</span>
        </div>
        <div class="icon" ondblclick="openWindow('photos-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/camera3-2.png" alt="Photos">
            <span>Us.jpg</span>
        </div>
        <div class="icon" ondblclick="openWindow('poetry-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-2.png" alt="Poetry">
            <span>Love_Letter.txt</span>
        </div>
    </div>

    <div id="start-menu" class="start-menu" style="display: none;">
        <div class="sidebar">
            <span class="vertical-text">LoveOS 98</span>
        </div>
        <div class="menu-items">
            <div class="menu-item" onclick="openWindow('music-window'); toggleStartMenu()">
                <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png"> Playlist
            </div>
            <div class="menu-item" onclick="openWindow('photos-window'); toggleStartMenu()">
                <img src="https://win98icons.alexmeub.com/icons/png/camera3-2.png"> Photos
            </div>
            <div class="menu-item" onclick="openWindow('video-window'); toggleStartMenu()">
                <img src="https://win98icons.alexmeub.com/icons/png/film_strip-0.png"> Videos
            </div>
            <div class="menu-item" onclick="openWindow('poetry-window'); toggleStartMenu()">
                <img src="https://win98icons.alexmeub.com/icons/png/notepad-2.png"> Poetry
            </div>
            <div class="divider"></div>
            <div class="menu-item" onclick="alert('Shutting down... just kidding, never leaving you.')">
                <img src="https://win98icons.alexmeub.com/icons/png/shut_down_cool-4.png"> Shut Down
            </div>
        </div>
    </div>

    <div id="photos-window" class="window draggable" style="display: none; top: 10%; left: 10%;">
        <div class="title-bar">
            <div class="title-bar-text">Photo Viewer</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('photos-window')"></button>
            </div>
        </div>
        <div class="window-body">
            <img src="./assets/cute-photo.jpg" alt="Us" style="width:100%; border: 2px inset #fff;">
            <p style="text-align:center">Best Day Ever ❤️</p>
        </div>
    </div>

    <div id="video-window" class="window draggable" style="display: none; top: 15%; left: 40%;">
        <div class="title-bar">
            <div class="title-bar-text">Media Player</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('video-window')"></button>
            </div>
