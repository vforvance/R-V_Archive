<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="desktop">
        <div class="icon" ondblclick="openWindow('music-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png" alt="Music">
            <span>Our Playlist</span>
        </div>
        <div class="icon" ondblclick="openWindow('video-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/film_strip-0.png" alt="Videos">
            <span>Videos</span>
        </div>
        <div class="icon" ondblclick="openWindow('photos-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/camera3-2.png" alt="Photos">
            <span>Photos</span>
        </div>
        <div class="icon" ondblclick="openWindow('poetry-window')">
            <img src="https://win98icons.alexmeub.com/icons/png/notepad-2.png" alt="Poetry">
            <span>For_Her.txt</span>
        </div>
    </div>

    <div id="music-window" class="window draggable" style="display: none; top: 10%; left: 10%;">
        <div class="title-bar">
            <div class="title-bar-text">Winamp - Our Songs</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('music-window')"></button>
            </div>
        </div>
        <div class="window-body">
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </div>

    <div id="video-window" class="window draggable" style="display: none; top: 15%; left: 40%;">
        <div class="title-bar">
            <div class="title-bar-text">Media Player</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('video-window')"></button>
            </div>
        </div>
        <div class="window-body">
            <p>Our First Date:</p>
            <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div id="poetry-window" class="window draggable" style="display: none; top: 20%; left: 20%;">
        <div class="title-bar">
            <div class="title-bar-text">Notepad</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('poetry-window')"></button>
            </div>
        </div>
        <div class="window-body">
            <textarea style="width: 100%; height: 200px; resize: none;">
My love,

This is a digital space
Just for your pretty face.
(Type your poems here...)
            </textarea>
        </div>
    </div>

    <div class="taskbar">
        <button class="start-button">
            <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" alt="Start">
            <b>Start</b>
        </button>
        <div class="time-box" id="clock">12:00 PM</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
